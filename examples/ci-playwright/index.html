<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>CI example – jest-browser-reporter</title>
</head>
<body style="margin: 0">
    <div id="app"></div>
    <script type="module">
        import { createTestPage } from 'jest-browser-reporter';

        // `?autorun` in the URL starts the run; `?grep=text` limits it.
        createTestPage({
            container: '#app',
            title: 'CI example',
            tests: () => import('./tests/index.js'),
        });
    </script>
</body>
</html>
